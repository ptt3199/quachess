[project]
name = "quaveo-chess"
version = "0.1.0"
description = "Quaveo Chess Club Rating & Schedule Web Application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi[standard]>=0.115.0",
    "fastapi-cache2[redis]>=0.2.2",
    "greenlet>=3.0.0",
    "itsdangerous>=2.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "redis>=4.2.0,<5.0.0",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30.0",
    "pywebpush>=2.5.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "migrations*", "static*"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[tool.fastapi]
entrypoint = "main:app"
app = "quaveo-chess"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "migrations/versions/*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008", # Do not perform function call `Depends`/`Query` in argument defaults (FastAPI design)
    "E712", # Comparison to True (SQLAlchemy queries require == True)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
